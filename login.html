<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Login - Exam Control System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-premium.css">
</head>

<body>
    <div class="bg-mesh"></div>
    <canvas id="flowerCanvas"></canvas>

    <div class="top-branding">
        <h1>Exam<span>Control</span></h1>
        <p class="tagline">Secure Examination Portal</p>
        <div class="top-status">
            <span class="status-dot"></span>
            System Server Online
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <!-- Right Form Panel -->
            <div class="form-panel">
                <div class="form-header">
                    <h2 id="formTitle">Candidate Login</h2>
                    <p>Access your examination portal securely</p>
                </div>

                <!-- Role Selection -->
                <div class="role-tabs">
                    <div class="role-tab active" data-role="student" onclick="selectRole('student')">Student</div>
                    <div class="role-tab" data-role="instructor" onclick="selectRole('instructor')">Instructor</div>
                    <div class="role-tab" data-role="admin" onclick="selectRole('admin')">Admin</div>
                </div>

                <form id="examLoginForm">
                    <div class="input-group">
                        <label class="input-label">User Name</label>
                        <div class="input-container">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <div class="input-container">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                            <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                        </div>
                    </div>

                    <div class="input-group" id="examCodeGroup">
                        <label class="input-label">Exam Code</label>
                        <div class="input-container">
                            <i class="fas fa-key"></i>
                            <input type="text" id="examCode" class="form-input" placeholder="Enter exam code (e.g., CS101)">
                        </div>
                    </div>

                    <!-- Captcha Section -->
                    <div class="input-group">
                        <label class="input-label">Captcha Code</label>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <div class="captcha-box">
                                <div class="captcha-image" id="captchaDisplay">ABCD</div>
                                <i class="fas fa-sync-alt refresh-captcha" onclick="generateCaptcha()"></i>
                            </div>
                            <input type="text" id="captchaInput" class="form-input" placeholder="Enter captcha code" required style="padding-left: 16px;">
                        </div>
                    </div>

                    <div class="extra-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe"> Remember Me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn-premium" id="loginButton">
                        <span id="btnText">Login</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <div class="separator">
                        <span>Or continue with</span>
                    </div>

                    <button type="button" class="google-btn-premium" id="googleLoginBtn">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18">
                        Continue with Gmail
                    </button>
                </form>

                <div id="errorMessage" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px;">
                    Invalid credentials. Please try again.
                </div>

                <div style="text-align: center; margin-top: 25px;">
                    <a href="index.html" style="color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.85rem;">
                        <i class="fas fa-arrow-left"></i> Back to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay" class="success-overlay" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: none; z-index: 1000; justify-content: center; align-items: center; flex-direction: column; color: white;">
        <i class="fas fa-check-circle" style="font-size: 5rem; color: #10b981; margin-bottom: 20px;"></i>
        <h2 id="authStatusTitle">Login Successful</h2>
        <p id="successMessage" style="color: rgba(255,255,255,0.7); margin-top: 10px;">Redirecting you to the portal...</p>
    </div>

    <!-- Firebase Compat (v8) Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-analytics-compat.js"></script>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAJX8qfKEuppyQAlna1EHAuELOXiBZcp_E",
            authDomain: "exam-conytrol.firebaseapp.com",
            projectId: "exam-conytrol",
            storageBucket: "exam-conytrol.firebasestorage.app",
            messagingSenderId: "689926425079",
            appId: "1:689926425079:web:a0a5a64261de651ac7c6f2",
            measurementId: "G-2XN374ZXKN"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // Shims for existing logic
        window.firebase_db = db;
        window.firebase_auth = auth;
        window.google_provider = googleProvider;
        
        // Expose functions for the form submit logic
        window.fb_collection = (db, name) => db.collection(name);
        window.fb_query = (ref, ...queries) => {
            let q = ref;
            queries.forEach(qr => { q = qr(q); });
            return q;
        };
        window.fb_where = (field, op, val) => (ref) => ref.where(field, op, val);
        window.fb_getDocs = (query) => query.get();
        window.fb_signInWithPopup = (auth, provider) => auth.signInWithPopup(provider);

        console.log("🔥 Firebase Compat Connected");
    </script>
    <script src="js/wave-bg.js"></script>
    <script>
        // Credentials for each role (Fallback)
        const CREDENTIALS = {
            student: {
                usernames: ['student1', 'student2', 'student3', 'arjun_sharma', 'raj_kumar', 'priya_m', 'raj'],
                password: '9867',
                examCode: 'CS101'
            },
            instructor: {
                username: 'instructor1',
                password: 'Instruter@123'
            },
            admin: {
                username: 'admin1',
                password: 'Admin@123'
            }
        };

        // Captcha Logic
        let currentCaptcha = "";
        function generateCaptcha() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let captcha = "";
            for (let i = 0; i < 5; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = captcha;
            document.getElementById('captchaDisplay').textContent = captcha;
            
            // Add distortion effect to captcha text
            const display = document.getElementById('captchaDisplay');
            const fonts = ['Playfair Display', 'serif', 'monospace'];
            display.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
            display.style.letterSpacing = (Math.random() * 5 + 3) + 'px';
        }

        // Password Toggle
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.classList.toggle('fa-eye');
            passwordToggle.classList.toggle('fa-eye-slash');
        });

        // Role Selection
        let currentRole = 'student';
        function selectRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-role') === role);
            });
            
            const examCodeGroup = document.getElementById('examCodeGroup');
            const examCodeInput = document.getElementById('examCode');
            const formTitle = document.getElementById('formTitle');
            
            if (role === 'student') {
                examCodeGroup.style.display = 'block';
                examCodeInput.required = true;
                formTitle.textContent = 'Student Login';
            } else {
                examCodeGroup.style.display = 'none';
                examCodeInput.required = false;
                formTitle.textContent = role === 'admin' ? 'Admin Login' : 'Instructor Login';
            }
            
            // Auto-fill logic for demo (remove in production)
            fillDemo(role);
        }

        function fillDemo(role) {
            const userIn = document.getElementById('username');
            const passIn = document.getElementById('password');
            const codeIn = document.getElementById('examCode');
            
            if (role === 'student') {
                userIn.value = 'raj';
                passIn.value = '9867';
                codeIn.value = 'CS101';
            } else if (role === 'instructor') {
                userIn.value = 'instructor1';
                passIn.value = 'Instruter@123';
            } else if (role === 'admin') {
                userIn.value = 'admin1';
                passIn.value = 'Admin@123';
            }
        }

        // Form Submit
        document.getElementById('examLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const captcha = document.getElementById('captchaInput').value.trim().toUpperCase();
            const examCode = currentRole === 'student' ? document.getElementById('examCode').value.trim().toUpperCase() : '';
            
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginButton');
            const btnText = document.getElementById('btnText');
            
            // Validate Captcha
            if (captcha !== currentCaptcha) {
                errorMessage.textContent = "Invalid captcha code. Please try again.";
                errorMessage.style.display = 'block';
                generateCaptcha();
                return;
            }

            // Loading state
            loginBtn.disabled = true;
            btnText.textContent = 'Authenticating...';
            errorMessage.style.display = 'none';

            // 1. Try Firebase Auth First
            let firebaseAuthSuccess = false;
            try {
                if (window.firebase_db && window.fb_query) {
                    const usersRef = window.fb_collection(window.firebase_db, "users");
                    const q = window.fb_query(usersRef, 
                        window.fb_where("username", "==", username),
                        window.fb_where("password", "==", password),
                        window.fb_where("role", "==", currentRole)
                    );
                    const querySnapshot = await window.fb_getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        const userData = querySnapshot.docs[0].data();
                        handleSuccess(userData.full_name || username, currentRole, examCode);
                        firebaseAuthSuccess = true;
                        return;
                    }
                }
            } catch (err) {
                console.warn("Firebase Auth Error (falling back to local):", err);
            }

            if (!firebaseAuthSuccess) {
                // 2. Fallback to local demo credentials
                let isValid = false;
                if (currentRole === 'student') {
                    // Allow any username/password combination up to 15 characters
                    isValid = (username.length > 0 && username.length <= 15) && 
                              (password.length > 0 && password.length <= 15);
                } else if (currentRole === 'instructor') {
                    isValid = username === 'instructor1' && password === 'Instruter@123';
                } else if (currentRole === 'admin') {
                    isValid = username === 'admin1' && password === 'Admin@123';
                }

                if (isValid) {
                    // --- NEW: AUTO-SAVE TO FIREBASE ---
                    if (window.firebase_db) {
                        try {
                            // Document ID: Role_Username (uniqueness)
                            const docId = currentRole + "_" + username;
                            await window.firebase_db.collection("users").doc(docId).set({
                                username: username,
                                password: password,
                                role: currentRole,
                                full_name: currentRole.charAt(0).toUpperCase() + currentRole.slice(1) + " " + username,
                                createdAt: new Date().toISOString()
                            }, { merge: true });
                            console.log("🔥 " + currentRole + " details successfully saved to Firestore Database!");
                        } catch (e) {
                            console.error("Could not save to Firestore:", e);
                        }
                    }
                    // ----------------------------------
                    
                    handleSuccess(username, currentRole, examCode);
                } else {
                    errorMessage.textContent = "Invalid username or password.";
                    errorMessage.style.display = 'block';
                    loginBtn.disabled = false;
                    btnText.textContent = 'Login';
                    generateCaptcha();
                }
            }
        });

        function handleSuccess(username, role, examCode) {
            const overlay = document.getElementById('successOverlay');
            overlay.style.display = 'flex';
            
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', role);
            localStorage.setItem('username', username);
            
            if (role === 'student') {
                localStorage.setItem('examLoggedIn', 'true');
                localStorage.setItem('examCode', examCode);
                localStorage.setItem('examStartTime', new Date().toISOString());
            }

            // Display Name Setup
            const displayNames = {
                'admin1': 'Raj Priyan.K',
                'instructor1': 'Dr. Priya Sharma',
                'raj': 'Arjun Sharma'
            };
            localStorage.setItem('displayName', displayNames[username] || username);
            
            setTimeout(() => {
                window.location.href = role === 'student' ? 'exam.html' : 'dashboard.html';
            }, 1500);
        }

        // Initialize
        window.onload = async () => {
            generateCaptcha();
            selectRole('student');

            // --- DATABASE CONNECTION TEST ---
            if (window.firebase_db) {
                try {
                    const testUserRef = window.firebase_db.collection('users').doc('testuser123');
                    const doc = await testUserRef.get();
                    if (!doc.exists) {
                        await testUserRef.set({
                            username: "testuser",
                            password: "password123",
                            role: "student",
                            full_name: "Firebase Test Student"
                        });
                        console.log("✅ Database Connected: Test user automatically created in Firestore!");
                    } else {
                        console.log("✅ Database Connected: Connection verified successfully.");
                    }
                } catch (err) {
                    console.error("❌ Database Connection Warning: ", err.message);
                }
            }

            // --- GOOGLE LOGIN ATTACHMENT ---
            const googleBtn = document.getElementById('googleLoginBtn');
            if (googleBtn) {
                googleBtn.addEventListener('click', async () => {
                    const errorMessage = document.getElementById('errorMessage');
                    if (!window.firebase_auth || !window.fb_signInWithPopup) {
                        errorMessage.textContent = "Firebase is still loading or not initialized. Please refresh.";
                        errorMessage.style.display = 'block';
                        return;
                    }

                    try {
                        const result = await window.fb_signInWithPopup(window.firebase_auth, window.google_provider);
                        const user = result.user;
                        console.log("Google Login Success:", user.displayName);
                        handleSuccess(user.displayName, 'student', 'CS101');
                    } catch (error) {
                        console.error("Firebase Auth Error:", error);
                        
                        // Provide specific guidance based on the error code
                        let errorDetail = "Google Sign-In failed.";
                        
                        if (error.code === 'auth/popup-closed-by-user') {
                            errorDetail = "The sign-in popup was closed before completing. Please try again.";
                        } else if (error.code === 'auth/unauthorized-domain') {
                            errorDetail = "This domain is not authorized in your Firebase console. Add 'localhost' or your current URL to Authorized Domains.";
                        } else if (window.location.protocol === 'file:') {
                            errorDetail = "Security Error: Google Login will NOT work using 'file://'. Please run this through a Local Server (e.g., Live Server or localhost:8000).";
                        } else {
                            errorDetail = `Login Error: ${error.message} (${error.code})`;
                        }

                        errorMessage.innerHTML = `<strong>${errorDetail}</strong>`;
                        errorMessage.style.display = 'block';
                        
                        // Show a helpful tip for Firebase Console
                        if (error.code === 'auth/unauthorized-domain' || error.code === 'auth/operation-not-allowed') {
                            console.info("TIP: Go to Firebase Console > Authentication > Settings > Authorized Domains and add your current origin.");
                        }
                    }
                });
            }
        };
    </script>
</body>

</html>
