<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result - Exam Control System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #09121d;
            --navy-blue: #1e3c72;
            --navy-light: #2a4a8f;
            --gold: #d4af37;
            --gold-light: #f2d06b;
            --platinum: #f5f7fa;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --info: #60a5fa;
            --dark-card: #1a2436;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* === FLOWER CANVAS BACKGROUND === */
        #flowerCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .result-container {
            background: rgba(50, 30, 5, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 20px 50px rgba(120, 80, 0, 0.4);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: slideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .result-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 30px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 8px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            transition: all 0.5s ease;
        }

        .percentage {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .score-label {
            color: var(--gold-light);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--gold);
            transform: translateY(-5px);
        }

        .item-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: block;
        }

        .item-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
        }

        .item-value.success { color: var(--success); }
        .item-value.danger { color: var(--danger); }

        .continue-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--primary-dark);
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            filter: brightness(1.1);
        }

        .confetti {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 480px) {
            .result-container { padding: 30px 20px; }
            .result-grid { grid-template-columns: 1fr; }
            .score-circle { width: 160px; height: 160px; }
            .percentage { font-size: 2.5rem; }
        }
    </style>
</head>

<body>
    <!-- Broken Glass Canvas Background -->
    <!-- Animated Flower Canvas Background -->
    <canvas id="flowerCanvas"></canvas>

    <div class="result-container">
        <div class="result-header">
            <h1 id="headerTitle">Exam Results</h1>
        </div>

        <div class="score-circle" id="scoreCircle">
            <div class="percentage" id="percentage">0%</div>
            <div class="score-label">Final Score</div>
        </div>

        <div class="result-grid">
            <div class="result-item">
                <span class="item-label">Obtained Marks</span>
                <div class="item-value" id="marks">0 / 0</div>
            </div>
            <div class="result-item">
                <span class="item-label">Questions Attempted</span>
                <div class="item-value" id="attempted">0 / 0</div>
            </div>
            <div class="result-item">
                <span class="item-label">Time Taken</span>
                <div class="item-value" id="timeTaken">00:00:00</div>
            </div>
            <div class="result-item">
                <span class="item-label">Total Violations</span>
                <div class="item-value" id="violations">0</div>
            </div>
        </div>

        <div class="status-message" id="statusMessage" style="margin-bottom: 30px; font-weight: 500;">
            Excellent work! You have successfully completed the exam.
        </div>

        <button class="continue-btn" onclick="goToDashboard()">
            <span>Continue to Dashboard</span>
            <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script src="js/wave-bg.js"></script>

    <script>

        document.addEventListener('DOMContentLoaded', () => {
            const results = JSON.parse(localStorage.getItem('lastExamResults'));
            
            if (!results) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Update UI with results
            document.getElementById('percentage').textContent = results.percentage + '%';
            document.getElementById('marks').textContent = `${results.score} / ${results.totalMarks}`;
            document.getElementById('attempted').textContent = `${results.questionsAttempted} / ${results.totalQuestions}`;
            document.getElementById('violations').textContent = results.violations;
            
            const timeTaken = formatTime(results.timeTaken);
            document.getElementById('timeTaken').textContent = timeTaken;

            // Apply conditional styling
            const scoreCircle = document.getElementById('scoreCircle');
            const violationsValue = document.getElementById('violations');
            const statusMessage = document.getElementById('statusMessage');
            const headerTitle = document.getElementById('headerTitle');

            if (results.status === 'Terminated') {
                headerTitle.textContent = 'Exam Terminated';
                headerTitle.style.color = 'var(--danger)';
                scoreCircle.style.borderColor = 'var(--danger)';
                statusMessage.textContent = `This exam was terminated due to a proctoring violation: ${results.reason}`;
                statusMessage.style.color = 'var(--danger)';
                document.getElementById('percentage').style.color = 'var(--danger)';
            } else {
                if (results.percentage >= 80) {
                    scoreCircle.style.borderColor = 'var(--success)';
                    statusMessage.textContent = 'Outstanding! You showed great mastery of the subject.';
                    statusMessage.style.color = 'var(--success)';
                } else if (results.percentage >= 50) {
                    scoreCircle.style.borderColor = 'var(--info)';
                    statusMessage.textContent = 'Well done! You have passed the exam successfully.';
                    statusMessage.style.color = 'var(--info)';
                } else {
                    scoreCircle.style.borderColor = 'var(--danger)';
                    statusMessage.textContent = 'Performance Below Threshold';
                    statusMessage.style.color = 'var(--danger)';
                }
            }

            if (results.violations > 0) {
                violationsValue.className = 'item-value danger';
            } else {
                violationsValue.className = 'item-value success';
            }
        });

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
